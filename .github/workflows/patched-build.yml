name: Patched Build (x64)

on:
  workflow_dispatch:
    inputs:
      target:
        description: "CMake target to build (unrealengine, or ALL_BUILD for everything)"
        required: true
        default: "unrealengine"

jobs:
  build:
    runs-on: windows-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_CACHE_SIZE: "5G"
      SCCACHE_C_CUSTOM_CACHE_BUSTER: "${{ github.workflow }}"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Set up shader tools
        shell: pwsh
        run: .\scripts\setup-dev-env.ps1 -Update -Tools dxc,slang,glslang

      - name: Set up Clang
        uses: egor-tensin/setup-clang@v1
        with:
          version: latest
          platform: x64

      - name: Install ninja-build tool
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Configure build for amd64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Configure CMake (x64)
        run: cmake --preset clang-x64 -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build target (x64)
        run: cmake --build build --config Release --target ${{ inputs.target }} --verbose

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

      - name: List build output
        run: dir build\Release

      - name: Upload addons
        uses: actions/upload-artifact@v4
        with:
          name: renodx-patched-addon64
          if-no-files-found: error
          path: |
            build/Release/*.addon64
            build/Release/*.pdb
